services:
  db:
    # Matches the version and settings of the supplied assessment database pack
    image: postgres:16.16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_insights}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment_local_only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      # Host port 55432 avoids clashing with any Postgres already running on 5432
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Persistent storage: data survives restarts; `docker compose down -v` resets it
      - pgdata:/var/lib/postgresql/data
      # Supplied schema, seed and verify scripts. They run in filename order, once,
      # only when the volume is empty, so restarts never duplicate records.
      - ./customer_insights_database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy only when Postgres accepts TCP connections AND the full seed is present,
      # so "healthy" means the assessment data is loaded, not just that the container started
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          && PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          'SELECT count(*) = 3000 FROM public.deals' | grep -qx t
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assessment}:${POSTGRES_PASSWORD:-assessment_local_only}@db:5432/${POSTGRES_DB:-customer_insights}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
